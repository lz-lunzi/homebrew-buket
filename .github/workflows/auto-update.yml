name: Auto Update Formulae and Casks

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - 'Casks/**'
      - '.github/workflows/auto-update.yml'
  schedule:
    # Every day at China time 09:00 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            echo "==> $name"
            if grep -qE '^\s*disable!\s' "$f"; then echo "  retired (moved to homebrew/core), skip"; continue; fi
            ver=$(brew livecheck "$name" 2>/dev/null | awk -F'==> ' '{print $2}')
            if [ -z "$ver" ]; then echo "  no livecheck result"; continue; fi
            cur=$(brew info --json=v2 "$name" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['formulae'][0]['versions']['stable'])" 2>/dev/null)
            if [ "$ver" = "$cur" ]; then echo "  already at $ver"; continue; fi
            echo "  $cur -> $ver"
            brew bump-formula-pr "$name" --version="$ver" --write-only --no-fork --no-audit 2>&1 | sed 's/^/    /'
          done

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for c in Casks/*.rb; do
            name="$(basename "$c" .rb)"
            echo "==> $name"
            if grep -qE '^\s*disable!\s' "$c"; then echo "  retired (moved to homebrew/cask), skip"; continue; fi
            ver=$(brew livecheck "$name" 2>/dev/null | awk -F'==> ' '{print $2}')
            if [ -z "$ver" ]; then echo "  no livecheck result"; continue; fi
            cur=$(grep -m1 -oE '^  version "[^"]+"' "$c" | grep -oE '"[^"]+"' | tr -d '"')
            if [ "$ver" = "$cur" ]; then echo "  already at $ver"; continue; fi
            echo "  $cur -> $ver"
            brew bump-cask-pr "$name" --version="$ver" --write-only --no-fork --no-audit 2>&1 | sed 's/^/    /'
          done

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: bump outdated packages [skip ci]"
          git push
